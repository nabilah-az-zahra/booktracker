services:
  db:
    image: postgres:16-alpine
    container_name: booktracker_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - booktracker_network

  redis:
    image: redis:7-alpine
    container_name: booktracker_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - booktracker_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: booktracker_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT}
      REDIS_ADDR: ${REDIS_ADDR}
      GO_ENV: ${GO_ENV}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - booktracker_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: booktracker_frontend
    restart: unless-stopped
    ports:
      - "3000:5173"
    environment:
      VITE_GOOGLE_BOOKS_API_KEY: ${VITE_GOOGLE_BOOKS_API_KEY}
    depends_on:
      - backend
    networks:
      - booktracker_network

volumes:
  postgres_data:
  redis_data:

networks:
  booktracker_network:
    driver: bridge
